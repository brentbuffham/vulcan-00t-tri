<!DOCTYPE html><html><head><meta charset=utf-8><title>Intercepts: .00t decode vs DXF</title>
<style>
body{margin:0;background:#111;color:#ddd;font:13px system-ui,Arial;overflow:hidden}
#i{position:fixed;top:0;left:0;z-index:10;padding:8px 11px;background:#000a;max-width:48ch;line-height:1.5;border-radius:0 0 6px 0}
#i b{color:#fff}
button,select,input[type=file],input[type=number]{background:#2a2a2a;color:#ddd;border:1px solid #456;padding:5px 9px;border-radius:4px;cursor:pointer;margin:2px}
label{margin-right:4px}
#err{color:#f66}
</style>
</head><body>
<div id=i>
  <b>Intercepts: live .00t decode vs DXF</b><br>
  <span style="color:#fa3">Points are decoded from the .00t <b>alone</b> via
  <code>vulcan00TParser.js</code> (vulZ + FastLZ). A DXF, if loaded, is used
  for the green/red scoring overlay <b>only</b> — never fed to the decoder.</span>
  <div style="margin-top:6px">
    <label>Example:</label><select id=sel></select><br>
    <label>.00t:</label><input type=file id=fOot accept=".00t">
    <label>.dxf:</label><input type=file id=fDxf accept=".dxf"><br>
    <label>match tol (mm):</label><input type=number id=tol value=250 style="width:6em">
  </div>
  <div id=stats></div>
  <div id=err></div>
  <div id=btns></div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script>
<script type=module>
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { parse00t } from './vulcan00TParser.js?v=vulz';

// ---- example fixtures (served over http) ------------------------------------
const EXAMPLES = [
  ['solid cube', 'tri-crack-solid.00t', 'tri-crack-solid.dxf'],
  ['cube (real coords)', 'cube.00t', ''],
  ['triangle', 'tri-crack-triangle.00t', 'tri-crack-triangle.dxf'],
  ['prism', 'tri-crack-prism.00t', 'tri-crack-prism.dxf'],
  ['4-sides prism', 'tri-crack-4sides-prism.00t', 'tri-crack-4sides-prism.dxf'],
  ['fan', 'tri-crack-fan.00t', 'tri-crack-fan.dxf'],
  ['hexhole', 'tri-crack-Hexhole.00t', 'tri-crack-HexHole.dxf'],
  ['nonround', 'tri-crack-NonRound.00t', 'tri-crack-NonRound.dxf'],
  ['sphere', 'tri-crack-SPHERE.00t', 'tri-crack-Sphere.dxf'],
  ['stepped pyramid', 'tri-crack-Stepped-pyramid.00t', 'tri-crack-Stepped-pyramid.dxf'],
  ['L-shape', 'tri-crack-L-SHAPE.00t', 'tri-crack-L-Shape.dxf'],
  ['big grid', 'tri-crack-BigGrid.00t', 'tri-crack-big-grid.dxf'],
];
const BASE = '../exampleFiles/';

// ---- minimal DXF 3DFACE reader ----------------------------------------------
// Returns { verts:[[x,y,z]...unique], faces:[[a,b,c]...], tris:n }.
function parseDxf(text) {
  const lines = text.split(/\r?\n/);
  const vmap = new Map();      // "x,y,z" -> index
  const verts = [];
  const faces = [];
  const keyOf = (p) => p.map(n => n.toFixed(4)).join(',');
  const idOf = (p) => {
    const k = keyOf(p);
    let id = vmap.get(k);
    if (id === undefined) { id = verts.length; vmap.set(k, id); verts.push(p); }
    return id;
  };
  for (let i = 0; i < lines.length - 1; i++) {
    if (lines[i].trim() !== '3DFACE') continue;
    const m = {};
    for (let j = i + 1; j < lines.length - 1; j++) {
      const code = lines[j].trim();
      if (code === '0') break;
      m[code] = lines[j + 1]; j++;
    }
    const corners = [];
    for (let c = 0; c < 4; c++) {
      const x = parseFloat(m[10 + c]), y = parseFloat(m[20 + c]), z = parseFloat(m[30 + c]);
      if (Number.isFinite(x)) {
        const p = [x, y, z];
        if (!corners.some(q => keyOf(q) === keyOf(p))) corners.push(p); // drop closure dup
      }
    }
    if (corners.length === 3) faces.push(corners.map(idOf));
  }
  return { verts, faces, tris: faces.length };
}

// ---- three.js scene ----------------------------------------------------------
const sc = new THREE.Scene();
let asp = innerWidth / innerHeight;
const camO = new THREE.OrthographicCamera(-100 * asp, 100 * asp, 100, -100, 0.1, 1e6);
const camP = new THREE.PerspectiveCamera(60, asp, 0.1, 1e6);
let cam = camO;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight);
document.body.appendChild(r.domElement);
let ctr = new OrbitControls(cam, r.domElement);
let bsC = new THREE.Vector3(), bsR = 1;
let sceneObjs = [];

function clearScene() {
  for (const o of sceneObjs) { sc.remove(o); o.geometry?.dispose?.(); o.material?.dispose?.(); }
  sceneObjs = [];
}
function add(o) { sc.add(o); sceneObjs.push(o); return o; }

// nearest-GT distance for each decoded vertex (brute force; fine at these sizes)
function scoreVsGt(decoded, gt, tol) {
  const cat = new Array(decoded.length).fill(0);
  let matched = 0;
  for (let i = 0; i < decoded.length; i++) {
    const [x, y, z] = decoded[i];
    let best = Infinity;
    for (const g of gt) {
      const d = (x - g[0]) ** 2 + (y - g[1]) ** 2 + (z - g[2]) ** 2;
      if (d < best) best = d;
    }
    if (Math.sqrt(best) <= tol) { cat[i] = 1; matched++; }
  }
  return { cat, matched };
}

function frame() {
  const a = innerWidth / innerHeight, h = bsR * 1.2;
  camO.top = h; camO.bottom = -h; camO.left = -h * a; camO.right = h * a;
  camO.near = 0.1; camO.far = bsR * 100; camO.updateProjectionMatrix();
  camP.near = 0.1; camP.far = bsR * 100; camP.updateProjectionMatrix();
  const p0 = new THREE.Vector3(bsC.x, bsC.y - bsR * 1.5, bsC.z + bsR * 1.5);
  camO.position.copy(p0); camP.position.copy(p0);
  ctr.target.copy(bsC); ctr.update();
}

function render(oot, dxf) {
  clearScene();
  document.getElementById('err').textContent = '';

  // center everything on the decoded mesh so large real-world coords render well
  const c = oot.bounds ? [
    (oot.bounds.min[0] + oot.bounds.max[0]) / 2,
    (oot.bounds.min[1] + oot.bounds.max[1]) / 2,
    (oot.bounds.min[2] + oot.bounds.max[2]) / 2,
  ] : [0, 0, 0];
  const off = (p) => [p[0] - c[0], p[1] - c[1], p[2] - c[2]];

  // decoded mesh (green surface + wireframe)
  const vFlat = [];
  for (const v of oot.vertices) { const q = off(v); vFlat.push(q[0], q[1], q[2]); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(vFlat, 3));
  g.setIndex(oot.faces.flat());
  g.computeVertexNormals();
  add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x114433, transparent: true, opacity: 0.5, side: THREE.DoubleSide })));
  add(new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({ color: 0x33cc88, transparent: true, opacity: 0.35 })));

  // optional GT scoring overlay
  const tol = parseFloat(document.getElementById('tol').value) || 250;
  let statHtml = `Decoded: <b>${oot.vertexCount}</b> verts, <b>${oot.faceCount}</b> tris (index base ${oot.indexBase})`;
  if (dxf) {
    const { cat, matched } = scoreVsGt(oot.vertices, dxf.verts, tol);
    const posG = [], posR = [];
    oot.vertices.forEach((v, k) => { const q = off(v); (cat[k] === 1 ? posG : posR).push(q[0], q[1], q[2]); });
    const mk = (arr, col, sz) => {
      const pg = new THREE.BufferGeometry();
      pg.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
      return add(new THREE.Points(pg, new THREE.PointsMaterial({ color: col, size: sz, sizeAttenuation: false })));
    };
    mk(posG, 0x33ff55, 6); mk(posR, 0xff3333, 5);
    // GT vertices as cyan reference dots
    const gv = dxf.verts.flatMap(off);
    mk(gv, 0x55ddff, 2);
    const pct = (100 * matched / oot.vertexCount).toFixed(1);
    statHtml += `<br>GT: ${dxf.verts.length} verts, ${dxf.tris} tris` +
      `<br>Matched: <b style="color:${matched === oot.vertexCount ? '#3f3' : '#fc2'}">${matched}/${oot.vertexCount} (${pct}%)</b>` +
      ` &lt;${tol}mm &nbsp;<span style=color:#3f3>green=match</span> <span style=color:#f55>red=miss</span> <span style=color:#5df>cyan=GT</span>`;
  } else {
    // no DXF: show decoded vertices as plain points
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.Float32BufferAttribute(vFlat, 3));
    add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x33ff55, size: 4, sizeAttenuation: false })));
    statHtml += `<br><span style="color:#888">load a DXF to score decoded vertices</span>`;
  }
  document.getElementById('stats').innerHTML = statHtml;

  g.computeBoundingSphere();
  bsC.copy(g.boundingSphere.center); bsR = g.boundingSphere.radius || 1;
  frame();
  buildButtons();
}

// ---- toggles / camera --------------------------------------------------------
function buildButtons() {
  document.getElementById('btns').innerHTML =
    `<button id=bm>surface</button><button id=bp>decoded pts</button>` +
    `<button id=bo>Ortho [O]</button><button id=bv>Plan view [V]</button>`;
  const meshes = sceneObjs.filter(o => o.isMesh || o.isLineSegments);
  const points = sceneObjs.filter(o => o.isPoints);
  document.getElementById('bm').onclick = () => meshes.forEach(o => o.visible = !o.visible);
  document.getElementById('bp').onclick = () => points.forEach(o => o.visible = !o.visible);
  document.getElementById('bo').onclick = () => setCam(cam === camO ? camP : camO);
  document.getElementById('bv').onclick = planView;
  document.getElementById('bo').textContent = cam === camO ? 'Ortho [O]' : 'Persp [P]';
}
function setCam(c) {
  if (c === cam) return;
  const t = ctr.target.clone(), p = cam.position.clone();
  ctr.dispose(); cam = c; cam.position.copy(p);
  ctr = new OrbitControls(cam, r.domElement); ctr.target.copy(t); ctr.update();
  buildButtons();
}
function planView() { cam.position.set(bsC.x, bsC.y, bsC.z + bsR * 2.5); cam.up.set(0, 1, 0); ctr.target.copy(bsC); ctr.update(); }
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'o') setCam(camO); else if (k === 'p') setCam(camP); else if (k === 'v') planView(); });
addEventListener('resize', () => { const a = innerWidth / innerHeight; camO.left = -camO.top * a; camO.right = camO.top * a; camO.updateProjectionMatrix(); camP.aspect = a; camP.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });

// ---- loading -----------------------------------------------------------------
let lastOot = null, lastDxf = null;
function decodeOot(arrayBuffer) {
  try {
    lastOot = parse00t(arrayBuffer);
    render(lastOot, lastDxf);
  } catch (e) {
    document.getElementById('err').textContent = 'decode failed: ' + e.message;
  }
}
document.getElementById('fOot').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => decodeOot(rd.result); rd.readAsArrayBuffer(f);
};
document.getElementById('fDxf').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { lastDxf = parseDxf(rd.result); if (lastOot) render(lastOot, lastDxf); };
  rd.readAsText(f);
};
document.getElementById('tol').onchange = () => { if (lastOot) render(lastOot, lastDxf); };

// dropdown of served examples (works when this page is served over http)
const sel = document.getElementById('sel');
sel.innerHTML = '<option value="">— pick —</option>' +
  EXAMPLES.map((e, i) => `<option value="${i}">${e[0]}</option>`).join('');
sel.onchange = async () => {
  const e = EXAMPLES[sel.value]; if (!e) return;
  document.getElementById('err').textContent = 'loading…';
  try {
    const ootBuf = await (await fetch(BASE + e[1])).arrayBuffer();
    lastDxf = e[2] ? parseDxf(await (await fetch(BASE + e[2])).text()) : null;
    decodeOot(ootBuf);
  } catch (err) {
    document.getElementById('err').textContent =
      'fetch failed (serve the repo over http, e.g. `python3 -m http.server`): ' + err.message;
  }
};

(function loop() { requestAnimationFrame(loop); ctr.update(); r.render(sc, cam); })();
</script>
</body></html>
