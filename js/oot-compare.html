<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vulcan .00t vs DXF Compare</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
.panel { position: absolute; top: 0; bottom: 0; overflow: hidden; }
#left { left: 0; width: 50%; border-right: 2px solid #333; }
#right { right: 0; width: 50%; }
.panel canvas { width: 100% !important; height: 100% !important; }
.label {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 6px;
  font-size: 14px; font-weight: 600; z-index: 5; pointer-events: none;
}
#left .label { color: #4ade80; }
#right .label { color: #f97316; }
.info {
  position: absolute; bottom: 8px; left: 8px;
  background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px;
  font-size: 12px; z-index: 5; line-height: 1.5;
}
.drop-hint {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  text-align: center; color: #555; z-index: 3; pointer-events: none;
}
.drop-hint h2 { font-size: 20px; margin-bottom: 4px; }
.drop-hint p { font-size: 13px; }
.drag-over { background: rgba(99,102,241,0.1); }
#controls {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 6px;
}
#controls button {
  background: #2a2a4a; color: #e0e0e0; border: 1px solid #444;
  padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;
}
#controls button:hover { background: #3a3a5a; border-color: #6366f1; }
</style>
</head>
<body>

<div id="controls">
  <select id="file-picker" onchange="loadExample(this.value)" style="background:#2a2a3e;color:#eee;border:1px solid #444;padding:4px 8px;font:inherit">
    <option value="">— Load test case —</option>
    <optgroup label="Solved / DXF available">
      <option value="triangle">Triangle (3v/1f)</option>
      <option value="plane">Plane (4v/2f)</option>
      <option value="cube">Cube (8v/12f)</option>
      <option value="linear">Linear Strip (7v/5f)</option>
      <option value="fan">Fan (6v/6f)</option>
      <option value="prism">Prism (4v/2f)</option>
      <option value="prism4">4-Sides Prism (5v/6f)</option>
      <option value="stepped">Stepped Pyramid (20v/18f)</option>
      <option value="lshape">L-Shape (12v/20f)</option>
      <option value="hexhole">Hexhole (12v/12f)</option>
      <option value="nonround">NonRound (16v/14f)</option>
      <option value="sphere">Sphere (50v/96f)</option>

      <option value="cube1">Cube1 (rotated, 8v/12f)</option>
      <option value="cube2">Cube2 (rotated, 8v/12f)</option>
      <option value="cube3">Cube3 (rotated, 8v/12f)</option>
      <option value="cube4">Cube4 (rotated, 8v/12f)</option>
      <option value="cube5">Cube5 (rotated, 8v/12f)</option>
    </optgroup>
  </select>
  <button onclick="toggleFaces()">Faces</button>
  <button onclick="toggleWire()">Wireframe</button>
  <button onclick="togglePts()">Points</button>
  <button onclick="toggleLabels()">Labels</button>
  <button onclick="resetView()">Reset</button>
  <button onclick="exportOBJ()">Export OOT as OBJ</button>
  <button onclick="toggleZColor()">Z-Color</button>
  <button onclick="toggleDebug()" style="background:#4a2a2a;border-color:#f66">Debug</button>
</div>
<div id="debug-panel" style="display:none;position:fixed;top:40px;right:0;width:50%;height:calc(100%-40px);background:rgba(10,10,30,0.95);z-index:20;overflow-y:auto;font-family:monospace;font-size:11px;padding:12px;color:#ccc">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <b style="color:#f97316;font-size:14px">EdgeBreaker Debug</b>
    <button onclick="toggleDebug()" style="background:#333;color:#fff;border:1px solid #555;padding:2px 8px;cursor:pointer">Close</button>
  </div>
  <div id="debug-content">Drop an .00t file first</div>
</div>

<div id="left" class="panel">
  <div class="label">DXF (Ground Truth)</div>
  <div class="drop-hint" id="hint-left"><h2>Drop .dxf here</h2><p>3DFACE DXF file</p></div>
  <div class="no-dxf" id="no-dxf" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fa3;font-family:sans-serif;pointer-events:none">
    <h2 style="margin:0 0 8px 0">No DXF available</h2>
    <p style="margin:0;color:#888">OOT panel still rendered →</p>
  </div>
  <div class="info" id="info-left" style="display:none">
    <div>Verts: <b id="lv">0</b> | Faces: <b id="lf">0</b></div>
  </div>
</div>

<div id="right" class="panel">
  <div class="label">OOT (Parsed)</div>
  <div class="drop-hint" id="hint-right"><h2>Drop .00t here</h2><p>Vulcan triangulation</p></div>
  <div class="info" id="info-right" style="display:none;max-height:40vh;overflow-y:auto">
    <div>Verts: <b id="rv">0</b> | Faces: <b id="rf">0</b></div>
    <div id="rwarn" style="color:#f66;display:none"></div>
    <div id="rverts" style="font-size:10px;margin-top:4px;font-family:monospace;color:#aaa"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { parse00t } from './vulcan00TParser.js?v=vulz';

// ═════════════════════════════════════════════════
// DXF PARSER (3DFACE only)
// ═════════════════════════════════════════════════
function parseDXF(text) {
  const verts = [], faces = [];
  const vm = new Map();
  function vkey(x,y,z) { return `${x.toFixed(4)},${y.toFixed(4)},${z.toFixed(4)}`; }
  function getVi(x,y,z) {
    const k = vkey(x,y,z);
    if (vm.has(k)) return vm.get(k);
    const i = verts.length;
    verts.push([x,y,z]);
    vm.set(k, i);
    return i;
  }

  const lines = text.split(/\r?\n/);
  let i = 0;
  while (i < lines.length) {
    if (lines[i].trim() === '3DFACE') {
      const pts = {};
      i++;
      while (i < lines.length - 1) {
        const code = parseInt(lines[i].trim());
        const val = lines[i+1].trim();
        if (code === 0) break;
        if (code >= 10 && code <= 37) pts[code] = parseFloat(val);
        i += 2;
      }
      if (pts[10] !== undefined) {
        const v0 = getVi(pts[10]||0, pts[20]||0, pts[30]||0);
        const v1 = getVi(pts[11]||0, pts[21]||0, pts[31]||0);
        const v2 = getVi(pts[12]||0, pts[22]||0, pts[32]||0);
        faces.push([v0,v1,v2]);
      }
    } else { i++; }
  }
  return { vertices: verts, faces, warnings: [] };
}

// ── OOT decode — production vulcan00TParser.js (vulZ / FastLZ) ──
// The old inline DELTA/EdgeBreaker toy decoder (and its Cheaters-Only DXF
// lookup) are retired: real decoding is now correct. See 00T_FORMAT.md.
function parseOOT(arrayBuffer) {
  const warnings = [];
  let r;
  try {
    r = parse00t(arrayBuffer);
  } catch (e) {
    return {
      vertices: [], faces: [], warnings: ['Parse error: ' + e.message],
      nVertsHeader: 0, nFacesHeader: 0,
      debugInfo: { coordValues: [], groups: [], trace: [], isNewFormat: null },
    };
  }
  const vertices = r.vertices.map(v => [v[0] || 0, v[1] || 0, v[2] || 0]);
  if (!r.magicOk) warnings.push('Not a vulZ container — parsed as a flat raw image');
  // Flat coord list for the debug panel; one "group" per scalar (X/Y/Z cycle).
  const coordValues = vertices.flat();
  const groups = coordValues.map((value, idx) => ({
    idx, value, kind: 'FULL', axis: idx % 3, tags: [],
  }));
  return {
    vertices,
    faces: r.faces,
    warnings,
    nVertsHeader: r.vertexCount,
    nFacesHeader: r.faceCount,
    debugInfo: { coordValues, groups, trace: [], isNewFormat: r.magicOk },
  };
}

// ═════════════════════════════════════════════════
// THREE.JS DUAL VIEWER
// ═════════════════════════════════════════════════
let scenes = {}, cameras = {}, renderers = {};
let meshes = { left: null, right: null };
let wires = { left: null, right: null };
let points = { left: null, right: null };
let labels = { left: [], right: [] };
let showWire = false, showPts = false, showLabels = true, showZLabels = false, showFaces = true;
let theta = Math.PI/4, phi = Math.PI/3, radius = 500;
let target = new THREE.Vector3();
let isDragging = false, prevX = 0, prevY = 0;
let currentOOT = null;

function initPanel(id) {
  const el = document.getElementById(id);
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x1a1a2e);
  s.add(new THREE.AmbientLight(0x404060, 2));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(1,2,3); s.add(d1);
  const d2 = new THREE.DirectionalLight(0x6666ff, 0.5); d2.position.set(-1,-1,-2); s.add(d2);
  s.add(new THREE.AxesHelper(50));

  const c = new THREE.PerspectiveCamera(60, el.clientWidth/el.clientHeight, 0.1, 100000);
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setSize(el.clientWidth, el.clientHeight);
  r.setPixelRatio(window.devicePixelRatio);
  el.appendChild(r.domElement);

  scenes[id] = s; cameras[id] = c; renderers[id] = r;
}

function updateCameras() {
  for (const id of ['left','right']) {
    const c = cameras[id];
    if (!c) continue;
    c.position.set(
      target.x + radius * Math.sin(phi) * Math.cos(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.sin(theta)
    );
    c.lookAt(target);
  }
}

function animate() {
  requestAnimationFrame(animate);
  for (const id of ['left','right']) {
    if (renderers[id] && scenes[id] && cameras[id])
      renderers[id].render(scenes[id], cameras[id]);
  }
}

function makeTextSprite(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color || '#ffffff';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, 32, 24);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(20, 10, 1);
  return sprite;
}

function loadMesh(panelId, result, color) {
  const s = scenes[panelId];
  if (meshes[panelId]) { s.remove(meshes[panelId]); meshes[panelId].geometry.dispose(); }
  if (wires[panelId]) { s.remove(wires[panelId]); wires[panelId].geometry.dispose(); }
  if (points[panelId]) { s.remove(points[panelId]); points[panelId].geometry.dispose(); }
  for (const lb of labels[panelId]) s.remove(lb);
  labels[panelId] = [];

  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (const [x,y,z] of result.vertices) {
    const px = isFinite(x) ? x : 0, py = isFinite(y) ? y : 0, pz = isFinite(z) ? z : 0;
    pos.push(px, pz, -py); // Z-up to Y-up
  }
  const idx = [];
  for (const [a,b,c] of result.faces) {
    if (a < result.vertices.length && b < result.vertices.length && c < result.vertices.length)
      idx.push(a,b,c);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (idx.length) {
    geo.setIndex(idx);
    geo.computeVertexNormals();
  }

  const mat = new THREE.MeshPhongMaterial({ color, side: THREE.DoubleSide, flatShading: true, shininess: 0, transparent: true, opacity: 0.6 });
  meshes[panelId] = new THREE.Mesh(geo, mat);
  s.add(meshes[panelId]);
  

  if (idx.length) {
    const wg = new THREE.WireframeGeometry(geo);
    wires[panelId] = new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.8, transparent: true }));
    wires[panelId].visible = showWire;
    s.add(wires[panelId]);
  }

  // Color points by axis value (Z=blue gradient, or per-axis coloring)
  geo.computeBoundingBox();
  const box = geo.boundingBox;
  const center = new THREE.Vector3(); box.getCenter(center);
  const size = box.getSize(new THREE.Vector3()).length();

  // Robust bounding box for camera fit: ignore extreme outliers caused by
  // decoder artifacts (e.g. cube1's V4 at (131040, 25, 10) — a single bad
  // DELTA decode would otherwise make the real geometry invisibly tiny).
  // Use median ± k*MAD per axis (works with as few as 3 verts).
  let robustCenter = center.clone();
  let robustSize = size;
  let outlierCount = 0;
  if (result.vertices.length >= 3) {
    const sortedAxis = (axIdx) => {
      const a = [];
      for (const v of result.vertices) if (isFinite(v[axIdx])) a.push(v[axIdx]);
      return a.sort((p,q)=>p-q);
    };
    const median = (a) => a.length ? a[Math.floor(a.length/2)] : 0;
    const mad = (a, m) => {
      const d = a.map(x => Math.abs(x - m)).sort((p,q)=>p-q);
      return d.length ? d[Math.floor(d.length/2)] : 0;
    };
    const xs = sortedAxis(0), ys = sortedAxis(1), zs = sortedAxis(2);
    const xMed = median(xs), yMed = median(ys), zMed = median(zs);
    const xMad = mad(xs, xMed), yMad = mad(ys, yMed), zMad = mad(zs, zMed);
    // Tolerance: median ± k*MAD with floor (so flat-axis cases stay sensible)
    const k = 6;
    const xTol = Math.max(xMad * k, Math.abs(xMed) * 0.5, 1);
    const yTol = Math.max(yMad * k, Math.abs(yMed) * 0.5, 1);
    const zTol = Math.max(zMad * k, Math.abs(zMed) * 0.5, 1);
    const xLo = xMed - xTol, xHi = xMed + xTol;
    const yLo = yMed - yTol, yHi = yMed + yTol;
    const zLo = zMed - zTol, zHi = zMed + zTol;
    // Three.js convention: pos = (px, pz, -py)
    robustCenter.set(xMed, zMed, -yMed);
    robustSize = Math.sqrt((xHi-xLo)**2 + (yHi-yLo)**2 + (zHi-zLo)**2);
    for (const [x,y,z] of result.vertices) {
      if (x < xLo || x > xHi || y < yLo || y > yHi || z < zLo || z > zHi) outlierCount++;
    }
  }

  // Build per-vertex colors: color by Z value (blue=low, red=high)
  const colors = new Float32Array(result.vertices.length * 3);
  let zMin = Infinity, zMax = -Infinity;
  for (const [x,y,z] of result.vertices) { if (isFinite(z)) { zMin = Math.min(zMin, z); zMax = Math.max(zMax, z); } }
  const zRange = zMax - zMin || 1;
  for (let i = 0; i < result.vertices.length; i++) {
    const z = result.vertices[i][2];
    const t = (z - zMin) / zRange; // 0=low Z, 1=high Z
    colors[i*3+0] = t;           // R: high at top
    colors[i*3+1] = 0.2;         // G: dim
    colors[i*3+2] = 1.0 - t;     // B: high at bottom
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const pm = new THREE.PointsMaterial({ size: 8, sizeAttenuation: false, vertexColors: true });
  points[panelId] = new THREE.Points(geo, pm);
  points[panelId].visible = true;
  s.add(points[panelId]);

  // Store a flat-color material for toggling
  points[panelId]._colorMat = pm;
  points[panelId]._flatMat = new THREE.PointsMaterial({ color: 0xff6666, size: 6, sizeAttenuation: false });

  // Vertex labels with Z value and axis info
  const labelColor = panelId === 'left' ? '#4ade80' : '#fb923c';
  const labelScale = Math.max(size * 0.06, 1);
  for (let i = 0; i < result.vertices.length; i++) {
    const [x,y,z] = result.vertices[i];
    if (!isFinite(x) || !isFinite(y) || !isFinite(z)) continue;
    // Show index + Z value in label
    const labelText = showZLabels ? `${i} z=${z.toFixed(0)}` : String(i);
    const sprite = makeTextSprite(labelText, labelColor);
    sprite.position.set(x, z + labelScale * 1.2, -y);
    sprite.scale.set(labelScale * (showZLabels ? 3 : 2), labelScale, 1);
    sprite.visible = showLabels;
    s.add(sprite);
    labels[panelId].push(sprite);
  }
  // If this mesh is degenerate (single vertex / size=0), don't collapse
  // the camera onto it. Keep current camera state if it's already set.
  // Use robust center/size so outlier vertices (decode artifacts) don't
  // make the real geometry invisibly small.
  if (robustSize > 1) {
    target.copy(robustCenter);
    radius = robustSize * 2.5;
  } else if (size > 1) {
    target.copy(center);
    radius = size * 2.5;
  } else if (radius < 1) {
    target.copy(center);
    radius = 1000;
  }
  updateCameras();

  // Surface outlier count to caller via a return value (read by loadExample
  // / drop handlers to add a viewer warning).
  return { outlierCount, robustSize, vertexCount: result.vertices.length };
}

// Mouse controls (synced between panels)
document.addEventListener('mousedown', e => { isDragging=true; prevX=e.clientX; prevY=e.clientY; });
document.addEventListener('mouseup', () => isDragging=false);
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  theta += (e.clientX-prevX)*0.005;
  phi = Math.max(0.01, Math.min(Math.PI-0.01, phi-(e.clientY-prevY)*0.005));
  prevX=e.clientX; prevY=e.clientY;
  updateCameras();
});
document.addEventListener('wheel', e => {
  radius *= e.deltaY > 0 ? 1.1 : 0.9;
  radius = Math.max(1, Math.min(50000, radius));
  updateCameras();
});

// Controls
window.toggleFaces = () => { showFaces=!showFaces; for (const id of ['left','right']) if(meshes[id]) meshes[id].visible=showFaces; };
window.toggleWire = () => { showWire=!showWire; for (const id of ['left','right']) if(wires[id]) wires[id].visible=showWire; };
window.togglePts = () => { showPts=!showPts; for (const id of ['left','right']) if(points[id]) points[id].visible=showPts; };
window.toggleLabels = () => { showLabels=!showLabels; for (const id of ['left','right']) for (const lb of labels[id]) lb.visible=showLabels; };
window.toggleZColor = () => {
  showZLabels = !showZLabels;
  // Reload meshes to update labels with Z values
  if (currentOOT) {
    // Rebuild OOT labels
    const s = scenes['right'];
    for (const lb of labels['right']) s.remove(lb);
    labels['right'] = [];
    if (currentOOT.vertices.length > 0) {
      const geo = points['right']?.geometry;
      if (geo) {
        geo.computeBoundingBox();
        const sz = geo.boundingBox.getSize(new THREE.Vector3()).length();
        const ls = Math.max(sz * 0.06, 1);
        for (let i = 0; i < currentOOT.vertices.length; i++) {
          const [x,y,z] = currentOOT.vertices[i];
          if (!isFinite(x)||!isFinite(y)||!isFinite(z)) continue;
          const txt = showZLabels ? `${i} z=${z.toFixed(0)}` : String(i);
          const sp = makeTextSprite(txt, '#fb923c');
          sp.position.set(x, z + ls * 1.2, -y);
          sp.scale.set(ls * (showZLabels ? 3 : 2), ls, 1);
          sp.visible = showLabels;
          s.add(sp);
          labels['right'].push(sp);
        }
      }
    }
  }
};
window.resetView = () => { theta=Math.PI/4; phi=Math.PI/3; updateCameras(); };

window.toggleDebug = () => {
  const panel = document.getElementById('debug-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block' && currentOOT && currentOOT.debugInfo) renderDebug(currentOOT);
};

function renderDebug(result) {
  const d = result.debugInfo;
  if (!d) return;
  const el = document.getElementById('debug-content');
  const axName = ['X','Y','Z'];
  let html = '';

  // Coord palette
  html += '<div style="color:#4ade80;margin-bottom:8px"><b>Coord Palette</b> (unique values from coord section)</div>';
  html += '<table style="border-collapse:collapse;margin-bottom:12px;width:100%">';
  html += '<tr style="color:#888"><td>Idx</td><td>Value</td><td>Kind</td><td>Axis</td><td>Tags</td></tr>';
  for (const g of d.groups.slice(0, 40)) {
    const ax = g.axis >= 0 && g.axis <= 2 ? axName[g.axis] : '?';
    const axColor = g.axis===0?'#f88':g.axis===1?'#8f8':g.axis===2?'#88f':'#888';
    const small = Math.abs(g.value) < 10 && g.idx > 3;
    html += `<tr style="border-top:1px solid #333;${small?'color:#555':''}">`;
    html += `<td style="padding:1px 6px">G${g.idx}</td>`;
    html += `<td style="padding:1px 6px;text-align:right">${g.value.toFixed(2)}</td>`;
    html += `<td style="padding:1px 6px;color:#aaa">${g.kind}</td>`;
    html += `<td style="padding:1px 6px;color:${axColor};font-weight:bold">${ax}</td>`;
    html += `<td style="padding:1px 6px;color:#777;font-size:10px">${g.tags.join(' ')}</td>`;
    html += '</tr>';
  }
  html += '</table>';

  // Vertices
  html += '<div style="color:#f97316;margin-bottom:8px"><b>Vertices</b> (' + result.vertices.length + ')</div>';
  html += '<table style="border-collapse:collapse;margin-bottom:12px;width:100%">';
  html += '<tr style="color:#888"><td>V#</td><td>X</td><td>Y</td><td>Z</td></tr>';
  for (let i = 0; i < Math.min(result.vertices.length, 50); i++) {
    const [x,y,z] = result.vertices[i];
    html += `<tr style="border-top:1px solid #333">`;
    html += `<td style="padding:1px 6px">V${i}</td>`;
    html += `<td style="padding:1px 6px;color:#f88;text-align:right">${x.toFixed(1)}</td>`;
    html += `<td style="padding:1px 6px;color:#8f8;text-align:right">${y.toFixed(1)}</td>`;
    html += `<td style="padding:1px 6px;color:#88f;text-align:right">${z.toFixed(1)}</td>`;
    html += '</tr>';
  }
  html += '</table>';

  // EdgeBreaker trace
  if (d.trace.length > 0) {
    html += '<div style="color:#c084fc;margin-bottom:8px"><b>EdgeBreaker Trace</b> (' + d.trace.length + ' ops)</div>';
    html += '<table style="border-collapse:collapse;margin-bottom:12px;width:100%">';
    html += '<tr style="color:#888"><td>Op</td><td>Tag</td><td>Sep</td><td>L</td><td>R</td><td>Prev</td><td>New</td><td>Bnd</td></tr>';
    for (let i = 0; i < d.trace.length; i++) {
      const t = d.trace[i];
      if (t.op === 'FIN') {
        html += `<tr style="border-top:1px solid #333;color:#555"><td colspan=8>FIN (gate-1)</td></tr>`;
        continue;
      }
      const opColor = t.op==='C'?'#4ade80':t.op==='R'?'#f97316':t.op==='L'?'#60a5fa':t.op==='E'?'#f43f5e':'#888';
      const sepStr = t.sep !== null ? '0x'+t.sep.toString(16).padStart(2,'0') : '-';
      const newStr = t.newV !== null ? `<b style="color:#4ade80">V${t.newV}</b>` : '-';
      html += `<tr style="border-top:1px solid #333">`;
      html += `<td style="padding:1px 4px;color:${opColor};font-weight:bold">${t.op}</td>`;
      html += `<td style="padding:1px 4px">40:${t.byte2.toString(16).padStart(2,'0')}</td>`;
      html += `<td style="padding:1px 4px;color:#777">${sepStr}</td>`;
      html += `<td style="padding:1px 4px">V${t.L}</td>`;
      html += `<td style="padding:1px 4px">V${t.R}</td>`;
      html += `<td style="padding:1px 4px;color:#aaa">V${t.prevBnd}</td>`;
      html += `<td style="padding:1px 4px">${newStr}</td>`;
      html += `<td style="padding:1px 4px;color:#555">${t.bndSize}</td>`;
      html += '</tr>';
    }
    html += '</table>';
  }

  el.innerHTML = html;
}
window.exportOBJ = () => {
  if (!currentOOT) return;
  let obj = '# Vulcan .00t export (Z-up)\n';
  for (const [x,y,z] of currentOOT.vertices) obj += `v ${x} ${y} ${z}\n`;
  for (const [a,b,c] of currentOOT.faces) obj += `f ${a+1} ${b+1} ${c+1}\n`;
  const blob = new Blob([obj], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='export.obj'; a.click();
};

// Drag & drop
function setupDrop(panelId, handler) {
  const el = document.getElementById(panelId);
  el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', e => { el.classList.remove('drag-over'); });
  el.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
    for (const f of e.dataTransfer.files) { handler(f); break; }
  });
}

window.loadExample = async (key) => {
  if (!key) return;
  const [ootName, dxfName] = EXAMPLE_PAIRS[key];
  const base = '../exampleFiles/';
  try {
    // Always fetch the OOT; only fetch the DXF if a name is provided.
    const ootRes = await fetch(base + ootName + '?v=' + Date.now());
    const ootBuf = await ootRes.arrayBuffer();

    document.getElementById('hint-left').style.display = 'none';
    if (dxfName) {
      const dxfRes = await fetch(base + dxfName + '?v=' + Date.now());
      const dxfTxt = await dxfRes.text();
      const dxfResult = parseDXF(dxfTxt);
      document.getElementById('no-dxf').style.display = 'none';
      document.getElementById('info-left').style.display = 'block';
      document.getElementById('lv').textContent = dxfResult.vertices.length;
      document.getElementById('lf').textContent = dxfResult.faces.length;
      loadMesh('left', dxfResult, 0x4ade80);
    } else {
      // No DXF available — clear the left mesh and show indicator.
      document.getElementById('info-left').style.display = 'none';
      document.getElementById('no-dxf').style.display = 'block';
      loadMesh('left', { vertices: [], faces: [] }, 0x4ade80);
    }

    const ootResult = parseOOT(ootBuf);
    currentOOT = ootResult;
    document.getElementById('hint-right').style.display = 'none';
    document.getElementById('info-right').style.display = 'block';
    document.getElementById('rv').textContent = ootResult.vertices.length;
    document.getElementById('rf').textContent = ootResult.faces.length;
    const rwarn = document.getElementById('rwarn');
    if (ootResult.warnings && ootResult.warnings.length) {
      rwarn.style.display = 'block';
      rwarn.textContent = ootResult.warnings.join('; ');
    } else {
      rwarn.style.display = 'none';
    }
    document.getElementById('rverts').innerHTML = ootResult.vertices.map((v,i) =>
      `V${i}: (${v[0].toFixed(1)}, ${v[1].toFixed(1)}, ${v[2].toFixed(1)})`
    ).join('<br>');
    const meshInfo = loadMesh('right', ootResult, 0xf97316);
    // Show outlier warning if decode produced extreme values (e.g. cube1's
    // 131040 artifact). Append to the existing rwarn pane.
    if (meshInfo && meshInfo.outlierCount > 0) {
      const rwarn = document.getElementById('rwarn');
      const outlierMsg = `${meshInfo.outlierCount} of ${meshInfo.vertexCount} vertices are outliers (decode artifacts) — camera fit ignores them`;
      rwarn.style.display = 'block';
      rwarn.textContent = (rwarn.textContent ? rwarn.textContent + ' | ' : '') + outlierMsg;
    }
    if (document.getElementById('debug-panel').style.display !== 'none') renderDebug(ootResult);
    console.log('[loadExample]', key, {oot: ootResult});
  } catch (err) {
    console.error('[loadExample] failed:', err);
  }
};

  reader.readAsArrayBuffer(file);
});
